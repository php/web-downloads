name: Create PHP or architecture series files
run-name: Series init ${{ inputs.php_version }} (${{ inputs.subject }})
on:
  workflow_dispatch:
    inputs:
      subject:
        description: 'Initialize a VS/PHP series or copy an architecture series'
        type: choice
        default: vs
        required: true
        options:
          - vs
          - arch
      php_version:
        description: 'PHP series (e.g. 8.4; master is also supported for architecture copies)'
        required: true
      source_vs:
        description: 'Source VS Version (required only when subject is vs)'
        required: false
      target_vs:
        description: 'Target VS Version (required only when subject is vs)'
        required: false
      source_arch:
        description: 'Source architecture (used when subject is arch)'
        type: choice
        default: x64
        options:
          - x86
          - x64
          - arm64
      target_arch:
        description: 'Target architecture (used when subject is arch)'
        type: choice
        default: arm64
        options:
          - x86
          - x64
          - arm64
jobs:
  test:
    runs-on: ubuntu-latest
    environment: downloads.php.net
    steps:
      - name: Run
        run: |
          curl \
          --request POST \
          --location https://downloads.php.net/api/series-init \
          --header 'Authorization: Bearer ${{ secrets.AUTH_TOKEN }}' \
          --data '{ "subject": "${{ inputs.subject }}", "php_version": "${{ inputs.php_version }}", "source_vs": "${{ inputs.source_vs }}", "target_vs": "${{ inputs.target_vs }}", "source_arch": "${{ inputs.source_arch }}", "target_arch": "${{ inputs.target_arch }}" }'
